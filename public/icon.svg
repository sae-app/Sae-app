<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Sapphire to Electric Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="25%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Crisp Pure White to Soft Ice Gradient for the Glyph -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Ambient Shadow for Elevation -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Inner Ambient Glass Ring -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />

  <!-- Subtle Top Specular Lighting -->
  <ellipse cx="256" cy="64" rx="160" ry="32" fill="#ffffff" opacity="0.08" />

  <!-- Emblem: S Tidur (Horizontal 'S') -->
  <g transform="translate(256, 256) rotate(90)" filter="url(#softGlow)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      dominant-baseline="central"
      fill="url(#glyphGrad)"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Nimbus Sans', 'Helvetica Neue', sans-serif"
      font-weight="900"
      font-size="340"
      letter-spacing="-0.02em"
    >S</text>
  </g>
</svg>
