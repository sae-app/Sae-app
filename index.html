    <script>
      // Vite HMR is disabled in AI Studio container iframe environment.
      // Safely mock vite-hmr WebSocket so @vite/client doesn't throw unhandled connection errors.
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'))) {
              const target = new EventTarget();
              const mockWs = {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: 'vite-hmr',
                send() {},
                close() {
                  this.readyState = 3;
                  target.dispatchEvent(new Event('close'));
                },
                addEventListener(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent(event) {
                  return target.dispatchEvent(event);
                }
              };
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return mockWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global fallback to ignore WebSocket closed without opened errors
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
            (typeof event.reason === 'string' && event.reason.includes('WebSocket'))
          )) {
            event.preventDefault();
          }
        });
      })();
    </script>
